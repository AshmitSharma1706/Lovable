spring:
  application:
    name: lovable

  datasource:
    url: jdbc:postgresql://${DB_HOST_URL}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  servlet:
#    context-path: /api/v1
  port: ${PORT:8080}

