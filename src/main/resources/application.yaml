spring:
  application:
    name: lovable

  datasource:
    url: jdbc:postgresql://${DB_HOST_URL}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
#          model: openai/gpt-5.2-codex
          model: google/gemini-3-flash-preview
          temperature: 0.0

server:
  servlet:
#    context-path: /api/v1
  port: ${PORT:8080}

jwt:
  secret-key: ${JWT_KEY}

stripe:
  secret-key: ${STRIPE_KEY}
  webhook:
    secret: ${WEBHOOKS_KEY}

client:
  url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: ${ACCESS_KEY}
  secret-key: ${SECRET_KEY}
  project-bucket: lovable-ai